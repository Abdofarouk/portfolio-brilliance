<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Agent-Based Concepts for Telco</title>
  <desc id="desc">Intent to execution control loop with planner, policy, and orchestrator agents for cloud-native telecommunications systems.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#071223"/>
      <stop offset="100%" stop-color="#0d213d"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#27a4ff"/>
      <stop offset="100%" stop-color="#6fe2ff"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>

  <g stroke="#1e3557" stroke-width="1">
    <path d="M0 125h1600M0 250h1600M0 375h1600M0 500h1600M0 625h1600M0 750h1600M0 875h1600"/>
    <path d="M160 0v1000M320 0v1000M480 0v1000M640 0v1000M800 0v1000M960 0v1000M1120 0v1000M1280 0v1000M1440 0v1000"/>
  </g>

  <text x="90" y="95" fill="#d8e8ff" font-size="32" font-family="Inter, Arial, sans-serif" font-weight="600">Agent-Based Concepts for Telco</text>
  <text x="90" y="132" fill="#8facd4" font-size="20" font-family="Inter, Arial, sans-serif">Intent translation, planning, policy checks, orchestration, and continuous feedback</text>

  <rect x="110" y="180" width="1380" height="700" rx="30" fill="#0b1a31" stroke="#2d4a72" stroke-width="2"/>

