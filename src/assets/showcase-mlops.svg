<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">MLOps and LLMOps for Telco Workloads</title>
  <desc id="desc">Pipeline board showing data ingestion, training, validation, deployment, and runtime observability loops.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#071223"/>
      <stop offset="100%" stop-color="#0d2341"/>
    </linearGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#31b7ff"/>
      <stop offset="100%" stop-color="#84edff"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="1000" fill="url(#bg)"/>
  <text x="92" y="98" fill="#d8e8ff" font-size="30" font-family="Inter, Arial, sans-serif" font-weight="600">MLOps + LLMOps for Telco Workloads</text>
  <text x="92" y="134" fill="#8facd4" font-size="20" font-family="Inter, Arial, sans-serif">Lifecycle pipelines, guardrails, and runtime orchestration in production telecom systems</text>

  <rect x="100" y="190" width="1400" height="650" rx="28" fill="#0b1a31" stroke="#2b4a73" stroke-width="2"/>

  <g font-family="Inter, Arial, sans-serif" font-size="21" fill="#d7e8ff">
    <rect x="160" y="280" width="220" height="92" rx="16" fill="#122744" stroke="#3f6795"/>
    <text x="198" y="336">Data Ingest</text>

    <rect x="430" y="280" width="220" height="92" rx="16" fill="#122744" stroke="#3f6795"/>
    <text x="488" y="336">Feature Hub</text>

    <rect x="700" y="280" width="220" height="92" rx="16" fill="#122744" stroke="#3f6795"/>
    <text x="754" y="336">Train</text>

    <rect x="970" y="280" width="220" height="92" rx="16" fill="#122744" stroke="#3f6795"/>
    <text x="1026" y="336">Validate</text>

    <rect x="1240" y="280" width="220" height="92" rx="16" fill="#122744" stroke="#3f6795"/>
    <text x="1300" y="336">Deploy</text>

    <rect x="300" y="500" width="340" height="100" rx="16" fill="#0f2f4d" stroke="url(#flow)" stroke-width="2.5"/>
    <text x="352" y="562">Model Registry + LCM</text>

    <rect x="700" y="500" width="340" height="100" rx="16" fill="#0f2f4d" stroke="url(#flow)" stroke-width="2.5"/>
    <text x="770" y="562">Inference Gateway</text>

    <rect x="1100" y="500" width="280" height="100" rx="16" fill="#0f2f4d" stroke="url(#flow)" stroke-width="2.5"/>
    <text x="1176" y="562">A/B + Canary</text>
  </g>

  <g stroke="url(#flow)" stroke-width="4" fill="none" stroke-linecap="round">
    <path d="M380 326h50M650 326h50M920 326h50M1190 326h50"/>
    <path d="M1350 372v86h-880v42"/>
    <path d="M640 550h60M1040 550h60"/>
    <path d="M830 600v90h-360v-90"/>
  </g>

  <g fill="#79e6ff">
    <circle cx="405" cy="326" r="6"/>
    <circle cx="675" cy="326" r="6"/>
    <circle cx="945" cy="326" r="6"/>
    <circle cx="1215" cy="326" r="6"/>
    <circle cx="470" cy="500" r="6"/>
    <circle cx="830" cy="500" r="6"/>
    <circle cx="1240" cy="500" r="6"/>
  </g>

  <text x="160" y="760" fill="#93b2d8" font-size="18" font-family="Inter, Arial, sans-serif">Closed loop: telemetry -> retraining -> policy tuning -> redeployment</text>
</svg>
