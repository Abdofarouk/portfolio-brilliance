  <text x="535" y="292" fill="#e5f2ff" font-size="28" font-family="Inter, Arial, sans-serif">Planner Agent</text>

  <rect x="500" y="430" width="260" height="100" rx="16" fill="#0a2f4d" stroke="url(#accent)" stroke-width="3"/>
  <text x="540" y="492" fill="#e5f2ff" font-size="28" font-family="Inter, Arial, sans-serif">Policy Agent</text>

  <rect x="500" y="630" width="260" height="100" rx="16" fill="#0a2f4d" stroke="url(#accent)" stroke-width="3"/>
  <text x="510" y="692" fill="#e5f2ff" font-size="28" font-family="Inter, Arial, sans-serif">Orchestrator Agent</text>

  <rect x="850" y="320" width="280" height="100" rx="16" fill="#112845" stroke="#35618f"/>
  <text x="876" y="380" fill="#d5e6ff" font-size="28" font-family="Inter, Arial, sans-serif">Network Actions</text>

